# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
ontoRepo:
  options:
    autoDiscover: true
  include:
    profiles:
      - bootstrapCrossRepoCI
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ env.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/ai-harness/sandbox/purpose.md
            dest: assets/docs-agents/purpose.md
          - source: //shared/license/LICENSE
            dest: LICENSE
          - dest: assets/data
            <<<:
              - source: //templates/2-data
                options:
                  skipAutoGeneratedHeader: false
                <<<:
                  - source: /makefile-agents.md.ontoRepo.tpl
                    dest: makefile.agents.md
                  - source: /repo-structure.md.ontoRepo.tpl
                    dest: repo-structure.md
          - source: //repos/ai-harness/sandbox/templates/3-audience
            options:
              skipAutoGeneratedHeader: false
            <<<:
              - source: /README.md.ontoRepo.tpl
                dest: README.md
              - source: /AGENTS.md.ontoRepo.tpl
                dest:
                  - CLAUDE.md
                  - path: AGENTS.md
                    options:
                      renderReferencedFiles: true

claude-agents:
  options:
    autoDiscover: true
    runIf:
      - builtin:isVirt
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/configs@${{ env.AI_CONFIGS_REF }}//profiles/claude/che.yml::claude/virt"
        ctx:
          repo: AiSandbox
envSeed:
  include:
    renderTemplates:
      - source: .env.tpl
        dest:
          - path: .env
            options:
              writeType: mergeUpsert

bootstrapCrossRepoCI:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/cross-repo/misc@${{ env.MISC_REF }}//che.yml::bootstrapCrossRepoCI"

