workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build-image
  - validate
  - release

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/ci-images/ci-linux:v0.0.6
  DEV_SANDBOX_IMAGE: $CI_REGISTRY_IMAGE/dev-sandbox

build-dev-sandbox-image:
  stage: build-image
  needs: []
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $CI_COMMIT_TAG
    - changes:
        - ci/dev-sandbox/Dockerfile
        - ci/tool-versions.env
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --driver docker-container dind
    #[why] on a tag pipeline publish the immutable :vX.Y.Z the local image build pins; else re-tag :bookworm as the version slot (harmless no-op)
    - VERSION_TAG="${CI_COMMIT_TAG:-bookworm}"
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/dev-sandbox/Dockerfile"
        --platform linux/arm64,linux/amd64
        --tag "$DEV_SANDBOX_IMAGE:$VERSION_TAG"
        --tag "$DEV_SANDBOX_IMAGE:bookworm"
        --tag "$DEV_SANDBOX_IMAGE:latest"
        --tag "$DEV_SANDBOX_IMAGE:$CI_COMMIT_SHORT_SHA"
        --cache-from "type=registry,ref=$DEV_SANDBOX_IMAGE-cache"
        --cache-to "type=registry,ref=$DEV_SANDBOX_IMAGE-cache,mode=max"
        --push
        "$CI_PROJECT_DIR"

validate-pre-commit-all:
  stage: validate
  needs: []
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - make run-repo-ci-precommit-all
    - git diff --exit-code HEAD

#[why] auto-tag vX.Y.Z on main; the tag pipeline rebuilds the image and publishes the immutable :vX.Y.Z the local build pins
release:
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GITLAB_TOKEN: $CI_JOB_TOKEN
  script:
    - NEXT=$(sh ci/next-version.sh)
    - echo "releasing $NEXT"
    - glab release create "$NEXT" --name "sandbox $NEXT" --ref "$CI_COMMIT_SHA" --notes "sandbox $NEXT"
##[<] 🤖🤖🤖
