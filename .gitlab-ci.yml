workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $BUILD_SANDBOX_IMAGE
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - build-image
  - validate

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. jobs needing arm64 or another size
#   override with their own tags
default:
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

variables:
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
  SANDBOX_IMAGE: $CI_REGISTRY_IMAGE/sandbox

.build-image:
  stage: build-image
  image: docker:27-cli
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  rules:
    - if: $CI_MERGE_REQUEST_DRAFT == "true"
      when: never
    - if: $BUILD_SANDBOX_IMAGE
    - changes:
        - ci/docker/**/*
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual
      allow_failure: true
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker context create dind --docker "host=$DOCKER_HOST,ca=$DOCKER_CERT_PATH/ca.pem,cert=$DOCKER_CERT_PATH/cert.pem,key=$DOCKER_CERT_PATH/key.pem"
    - docker buildx create --use --driver docker-container dind
    - CHE_REF="$(wget -S --spider -q -O /dev/null "https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che/latest/che_latest_linux_amd64.tar.gz" 2>&1 | tr -d '\r' | awk 'tolower($1)=="etag:"{print $2}')"
    - CONFIGS_REF="$(wget -qO- 'https://gitlab.com/api/v4/projects/konradodwrot%2Fconfigs/repository/commits?path=profiles&per_page=1' | sed -n 's/.*"id":"\([0-9a-f]*\)".*/\1/p')"

build-sandbox-image-amd64:
  extends: .build-image
  needs: []
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/docker/Dockerfile"
        --platform linux/amd64
        --build-arg "CHE_REF=$CHE_REF"
        --build-arg "CONFIGS_REF=$CONFIGS_REF"
        --tag "$SANDBOX_IMAGE:latest"
        --tag "$SANDBOX_IMAGE:$CI_COMMIT_SHORT_SHA"
        --push
        "$CI_PROJECT_DIR"

build-sandbox-image-arm64:
  extends: .build-image
  tags: [gke-linux-arm64]
  needs: []
  script:
    - docker buildx build
        --file "$CI_PROJECT_DIR/ci/docker/Dockerfile"
        --platform linux/arm64
        --build-arg "CHE_REF=$CHE_REF"
        --build-arg "CONFIGS_REF=$CONFIGS_REF"
        --tag "$SANDBOX_IMAGE:latest-arm64"
        --tag "$SANDBOX_IMAGE:$CI_COMMIT_SHORT_SHA-arm64"
        --push
        "$CI_PROJECT_DIR"

validate-pre-commit-all:
  stage: validate
  needs: []
  rules:
    - if: $BUILD_SANDBOX_IMAGE
      when: never
    - when: on_success
  image: $CI_IMAGE
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD
