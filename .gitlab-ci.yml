include:
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file:
      - consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. jobs needing arm64 or another size
#   override with their own tags
#[why] a superseded pipeline holds pods for a commit nobody will merge: cancel it and let
#   the autoscaler release the node. jobs with an external side effect opt out individually
default:
  interruptible: true
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  CENTRALIZED_ASSETS_GENERIC_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
  #[why] tools-configs' released spec still names misc and prose/assets: che parses every remote
  #   profile at init, so the pull below fails on a bare ref until tools-configs ships its move
  MISC_REF: $GRP_KO_VAR_MISC_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  TOOLS_CONFIGS_REF: $GRP_KO_VAR_TOOLS_CONFIGS_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  #[why] nothing here reads it, configs' gitlab/base/macos profile does: this repo pulls configs,
  #   whose spec resolves automation@${{ env.AUTOMATION_REF }} at parse time. Dropping it fails
  #   che's remote-source parse before any profile renders
  AUTOMATION_REF: $GRP_KO_VAR_AUTOMATION_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF

#[why] CI validates, it does not build: both images are built on the host that runs the cluster,
#   so a dry run catches a broken profile without producing an image nothing would pull
validate-che-profiles:
  rules:
    - changes:
        - .che/**/*
        - ci/**/*
        - .gitlab-ci.yml
  stage: validate
  needs: []
  image: $CI_IMAGE
  #[why] copied to /tmp, outside the checkout: -C changes directory but che then resolves the
  #   enclosing repo, so any path inside this one loads the root che.yml (ontoRepo,
  #   not sandbox-image). the image build hits this spec at ~/.sandbox-che, outside any repo, so
  #   validating a copy the same way matches how it is actually used
  script:
    - mkdir -p /tmp/sandbox-che
    - cp ci/docker/che.yml /tmp/sandbox-che/che.yml
    - che run --profiles sandbox-image --dry-run all --validate-spec error
        -C /tmp/sandbox-che
