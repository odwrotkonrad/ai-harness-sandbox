workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate

#[why] all CI runs on the self-hosted GKE runners: no SaaS compute minutes remain. set once here so a
#   new job inherits it instead of silently having no runner. jobs needing arm64 or another size
#   override with their own tags
#[why] a superseded pipeline holds pods for a commit nobody will merge: cancel it and let
#   the autoscaler release the node. jobs with an external side effect opt out individually
default:
  interruptible: true
  #[why] spot nodes are preempted mid-job and the manager itself runs on spot: infrastructure
  #   failures are expected, not exceptional. 2 is gitlab's hard maximum, so 3 attempts in total.
  #   retries cover runner and API faults only, never a failing script
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64

variables:
  CI_IMAGE: $GRP_VAR_ARTIFACT_REGISTRY/ci-linux:$GRP_VAR_CI_IMAGES_REF

#[why] CI validates, it does not build: both images are built on the host that runs the cluster,
#   so a dry run catches a broken profile without producing an image nothing would pull
validate-che-profiles:
  stage: validate
  needs: []
  image: $CI_IMAGE
  script:
    - che run --profiles sandbox-image --dry-run all --validate-spec error
        -C "$CI_PROJECT_DIR/ci/docker"

validate-pre-commit-all:
  stage: validate
  needs: []
  rules:
    - when: on_success
  image: $CI_IMAGE
  script:
    - make repo-ci-precommit-all
    - git diff --exit-code HEAD
