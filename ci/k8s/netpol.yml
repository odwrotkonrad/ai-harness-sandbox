#[why] baseline egress: selecting the session pods with any egress rule makes them default-deny, so DNS + in-cluster telemetry must be allowed explicitly; the dns rules let cilium snoop every resolution, the prerequisite for toFQDNs matching
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox-egress-baseline
spec:
  endpointSelector:
    matchLabels: {app: claude-sandbox}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
    - toEndpoints:
        - matchLabels: {app: sandbox-otelcol}
      toPorts:
        - ports:
            - {port: "4317", protocol: TCP}
---
#[why] the only internet egress: allowlisted FQDNs on 443 (TLS) only; no port-80 rule anywhere so plain HTTP is denied by default-deny, raw IPs and unlisted domains dropped in-kernel. extend by adding one matchName/matchPattern line below
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sandbox-egress-fqdn-allowlist
spec:
  endpointSelector:
    matchLabels: {app: claude-sandbox}
  egress:
    - toFQDNs:
        - {matchName: api.anthropic.com}
        - {matchPattern: "*.anthropic.com"}
        - {matchName: gitlab.com}
        - {matchName: registry.gitlab.com}
        - {matchName: github.com}
        - {matchName: api.github.com}
        - {matchPattern: "*.githubusercontent.com"}
        - {matchName: proxy.golang.org}
        - {matchName: sum.golang.org}
        - {matchPattern: "*.1password.com"}
        - {matchPattern: "*.googleapis.com"}
      toPorts:
        - ports:
            - {port: "443", protocol: TCP}
