apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sandbox-home
  labels: {app: claude-sandbox}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 16Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: "${SESSION}"
  labels: {app: claude-sandbox, session: "${SESSION}"}
spec:
  restartPolicy: Always
  containers:
    - name: sandbox
      image: localhost:5001/sandbox:local
      imagePullPolicy: Always
      env:
        - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://sandbox-otelcol:4317"}
        - {name: CHE_OTEL_ENDPOINT, value: "sandbox-otelcol:4317"}
        - {name: OTEL_RESOURCE_ATTRIBUTES, value: "session.name=${SESSION},service.namespace=sandbox"}
      securityContext: {privileged: true, runAsUser: 0}
      command:
        - sh
        - -c
        - |
          mkdir -p "/mnt/home/${SESSION}/upper" "/mnt/home/${SESSION}/work"
          chown ko:ko "/mnt/home/${SESSION}/upper"
          mount -t overlay overlay -o "lowerdir=/home/ko,upperdir=/mnt/home/${SESSION}/upper,workdir=/mnt/home/${SESSION}/work" /home/ko
          exec sleep infinity
      volumeMounts: [{name: home, mountPath: /mnt/home}]
  volumes:
    - name: home
      persistentVolumeClaim: {claimName: sandbox-home}
