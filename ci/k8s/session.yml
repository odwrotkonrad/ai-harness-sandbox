apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${SESSION}-home"
  labels: {app: claude-sandbox, session: "${SESSION}"}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 16Gi}}
---
apiVersion: v1
kind: Pod
metadata:
  name: "${SESSION}"
  labels: {app: claude-sandbox, session: "${SESSION}"}
spec:
  restartPolicy: Always
  containers:
    - name: sandbox
      image: sandbox:local
      imagePullPolicy: Never
      #[why] home as overlay: image /home/ko is the shared read-only base (lowerdir), the PVC keeps only this session's diff (upperdir); no per-session full copy of home
      #[why] privileged + root: mount(2) inside the container needs it; kubectl exec re-enters as ko via su
      securityContext: {privileged: true, runAsUser: 0}
      command:
        - sh
        - -c
        - |
          mkdir -p /mnt/home/upper /mnt/home/work
          mount -t overlay overlay -o lowerdir=/home/ko,upperdir=/mnt/home/upper,workdir=/mnt/home/work /home/ko
          chown ko:ko /mnt/home/upper
          exec sleep infinity
      volumeMounts: [{name: home, mountPath: /mnt/home}]
  volumes:
    - name: home
      persistentVolumeClaim: {claimName: "${SESSION}-home"}
