apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  labels: {app: sandbox-otelcol}
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}

    processors:
      batch: {}
      #[why] stamp sandbox-wide origin markers on every signal so session telemetry is distinguishable from host telemetry wherever it lands (prom labels, loki labels, jaeger process tags); session identity + signal type ride in from the pod via OTEL_RESOURCE_ATTRIBUTES
      resource/sandbox:
        attributes:
          - {key: deployment.environment, value: sandbox, action: upsert}
          - {key: otel.origin, value: sandbox-pod, action: upsert}

    exporters:
      #[why] forward into the host otelcol (reuses its prometheus/jaeger/loki fan-out); host.docker.internal reaches the macos host from the kind VM
      otlp:
        endpoint: host.docker.internal:4317
        tls: {insecure: true}

    service:
      pipelines:
        traces:  {receivers: [otlp], processors: [resource/sandbox, batch], exporters: [otlp]}
        metrics: {receivers: [otlp], processors: [resource/sandbox, batch], exporters: [otlp]}
        logs:    {receivers: [otlp], processors: [resource/sandbox, batch], exporters: [otlp]}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  labels: {app: sandbox-otelcol}
spec:
  replicas: 1
  selector: {matchLabels: {app: sandbox-otelcol}}
  template:
    metadata:
      labels: {app: sandbox-otelcol}
    spec:
      #[why] the control-plane node is tainted; tolerate it so the collector schedules on either node
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector:0.111.0
          args: [--config=/etc/otelcol/config.yml]
          ports:
            - {containerPort: 4317}
            - {containerPort: 4318}
          volumeMounts: [{name: config, mountPath: /etc/otelcol, readOnly: true}]
      volumes:
        - name: config
          configMap:
            name: otelcol-config
            items: [{key: config.yml, path: config.yml}]
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-otelcol
  labels: {app: sandbox-otelcol}
spec:
  selector: {app: sandbox-otelcol}
  ports:
    - {name: grpc, port: 4317, targetPort: 4317}
    - {name: http, port: 4318, targetPort: 4318}
