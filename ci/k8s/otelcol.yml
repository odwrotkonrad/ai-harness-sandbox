apiVersion: v1
kind: ConfigMap
metadata:
  name: otelcol-config
  labels: {app: sandbox-otelcol}
data:
  config.yml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
      prometheus:
        config:
          scrape_configs:
            - job_name: hubble
              kubernetes_sd_configs:
                - {role: pod, namespaces: {names: [kube-system]}}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_label_k8s_app]
                  action: keep
                  regex: cilium
                - source_labels: [__meta_kubernetes_pod_ip]
                  target_label: __address__
                  replacement: $$1:9965

    processors:
      batch: {}
      resource/sandbox:
        attributes:
          - {key: deployment.environment, value: sandbox, action: upsert}
          - {key: otel.origin, value: sandbox-pod, action: upsert}

    exporters:
      otlp:
        endpoint: host.docker.internal:4317
        tls: {insecure: true}

    service:
      pipelines:
        traces:  {receivers: [otlp], processors: [resource/sandbox, batch], exporters: [otlp]}
        metrics: {receivers: [otlp, prometheus], processors: [resource/sandbox, batch], exporters: [otlp]}
        logs:    {receivers: [otlp], processors: [resource/sandbox, batch], exporters: [otlp]}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-otelcol
  labels: {app: sandbox-otelcol}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-otelcol
  labels: {app: sandbox-otelcol}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-otelcol
  labels: {app: sandbox-otelcol}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-otelcol
subjects:
  - {kind: ServiceAccount, name: sandbox-otelcol, namespace: default}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otelcol
  labels: {app: sandbox-otelcol}
spec:
  replicas: 1
  selector: {matchLabels: {app: sandbox-otelcol}}
  template:
    metadata:
      labels: {app: sandbox-otelcol}
    spec:
      serviceAccountName: sandbox-otelcol
      tolerations:
        - {key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector:0.111.0
          args: [--config=/etc/otelcol/config.yml]
          ports:
            - {containerPort: 4317}
            - {containerPort: 4318}
          volumeMounts: [{name: config, mountPath: /etc/otelcol, readOnly: true}]
      volumes:
        - name: config
          configMap:
            name: otelcol-config
            items: [{key: config.yml, path: config.yml}]
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-otelcol
  labels: {app: sandbox-otelcol}
spec:
  selector: {app: sandbox-otelcol}
  ports:
    - {name: grpc, port: 4317, targetPort: 4317}
    - {name: http, port: 4318, targetPort: 4318}
