sandbox-image:
  include:
    profiles:
      - source: "git::https://gitlab.com/konradodwrot/tools-configs@${{ env.TOOLS_CONFIGS_REF }}"
        profiles:
          - base/packages
          - {spec: profiles/dev, profile: dev/virt/linux}
          - {spec: profiles/shell, profile: shell/virt/linux}
      - source: "git::https://gitlab.com/konradodwrot/ai-harness/ai-tools-configs@${{ env.AI_TOOLS_CONFIGS_REF }}"
        profile: ai/virt/linux
      - source: "git::https://gitlab.com/konradodwrot/tools-configs@${{ env.TOOLS_CONFIGS_REF }}"
        profiles:
          - {spec: profiles/cloud, profile: cloud/virt/linux}
          - {spec: profiles/misc, profile: misc/virt/linux}
          - {spec: profiles/git, profile: git/virt/linux}
          - {spec: profiles/gitlab, profile: gitlab/virt/linux}
