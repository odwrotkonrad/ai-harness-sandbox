# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
#[why] baked to ~/.sandbox-che/che.yml (its own tiny git repo: che resolves the spec from its working directory's repo root), composing configs tool profiles from the shallow clone the Dockerfile bakes at ~/projects/gitlab/konradodwrot/configs (che remote refs resolve only repo-root specs, so nested tool specs need a filesystem source); no autoDiscover, each caller names its profile
#[why] sandbox-build (image bake): secret-free tool set only. ssh is the config-links profile, never ssh/virt: isVirt is true inside a docker build, so ssh/virt would fire and try to bake keys
sandbox-build:
  include:
    profiles:
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/shell/zsh/base/che.yml::shell/zsh/base-linux"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/git/che.yml::git"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/llm/base/che.yml::llm/base"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/llm/claude/che.yml::llm/claude"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/dev/ruby/che.yml::dev/ruby"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/llm/codex/che.yml::llm/codex"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/cloud/gcp/che.yml::cloud/gcp/install"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/gitlab/glab/che.yml::gitlab/glab"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/misc/ssh/che.yml::misc/ssh"

#[why] sandbox-runtime (pod creation, session-create refreshes the configs checkout first): fail fast on missing ADC (gcp/auth), render the ssh keypair from gcp:// (ssh/virt), clone + index the workspace (gitlab/projects; needs GITLAB_TOKEN materialized by the caller, session-create fetches it from $GITLAB_TOKEN_SECRET_PATH via the pod's ADC)
sandbox-runtime:
  include:
    profiles:
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/cloud/gcp/che.yml::cloud/gcp/auth"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/misc/ssh/che.yml::misc/ssh/virt"
      - source: "~/projects/gitlab/konradodwrot/configs/profiles/gitlab/projects/che.yml::gitlab/projects"
        env:
          GITLAB_GROUPS: "konradodwrot:konradodwrot"
##[<] 🤖🤖
